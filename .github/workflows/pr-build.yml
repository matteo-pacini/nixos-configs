name: Build & Diff PR System

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_CACHE_URL: ${{ secrets.ATTIC_CACHE_URL }}
  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}

jobs:
  eval:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - host: BrightFalls
            os: ubuntu-latest
            system_attr: nixosConfigurations
          - host: Nexus
            os: ubuntu-latest
            system_attr: nixosConfigurations
          - host: CauldronLake
            os: ubuntu-latest
            system_attr: nixosConfigurations
          - host: WorkLaptop
            os: macos-latest
            system_attr: darwinConfigurations
          - host: NightSprings
            os: macos-latest
            system_attr: darwinConfigurations

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Evaluate configuration
        run: |
          nix eval ".#${{ matrix.system_attr }}.${{ matrix.host }}.config.system.build.toplevel.drvPath" --raw

  pr-build:
    needs: [eval]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: BrightFalls
            platform: x86_64-linux
            os: ubuntu-24.04
            system_attr: nixosConfigurations
            build_attr: config.system.build.toplevel
          - host: Nexus
            platform: x86_64-linux
            os: ubuntu-24.04
            system_attr: nixosConfigurations
            build_attr: config.system.build.toplevel
          - host: CauldronLake
            platform: x86_64-linux
            os: ubuntu-24.04
            system_attr: nixosConfigurations
            build_attr: config.system.build.toplevel
          - host: WorkLaptop
            platform: aarch64-darwin
            os: macos-latest
            system_attr: darwinConfigurations
            build_attr: config.system.build.toplevel
          - host: NightSprings
            platform: aarch64-darwin
            os: macos-latest
            system_attr: darwinConfigurations
            build_attr: config.system.build.toplevel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Linux builds stay on ubuntu-24.04: on 26.04 this step's apt purge fails with
      # "E: Solver timed out" (nothing-but-nix v10).
      - uses: wimpysworld/nothing-but-nix@v10
        if: ${{ matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm' }}
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          nix-permission-edict: true

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and
      # single-user Nix needs them for the build sandbox (sandbox-fallback is
      # off below, so without this every build fails).
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-outputs = true
            sandbox = ${{ runner.os == 'Linux' && 'true' || 'relaxed' }}
            sandbox-fallback = false
            ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}

      # Nexus's Caddy answers the cache only to the LAN, the tailnet and
      # Italian or UK addresses, so runners join the tailnet as ephemeral
      # tag:ci nodes. The tailnet policy limits tag:ci to nexus:443.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # CI needs no tailnet DNS: the cache host is pinned in /etc/hosts
          # below.
          args: --accept-dns=false

      # Public DNS points the cache at the WAN address, which a runner would
      # reach from outside the tailnet. Pin the cache host to Nexus's tailnet
      # address so requests go over Tailscale.
      - name: Route attic cache over the tailnet
        run: |
          # On macOS the action points the system resolver at 100.100.100.100
          # whenever the tailnet has MagicDNS on, regardless of --accept-dns,
          # and nothing outside the tailnet resolves. Hand DNS back to DHCP.
          if [ "$RUNNER_OS" = macOS ]; then
            sudo networksetup -setdnsservers Ethernet Empty
            sudo networksetup -setsearchdomains Ethernet Empty
          fi
          host=$(echo "$ATTIC_CACHE_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          ip=$(sudo tailscale ip -4 nexus-ts)
          [ -n "$ip" ] || { echo "::error::nexus-ts is not visible on the tailnet"; exit 1; }
          echo "$ip $host" | sudo tee -a /etc/hosts

      - name: Configure Attic cache
        run: |
          nix run nixpkgs#attic-client -- login \
            nexus "${{ env.ATTIC_CACHE_URL }}" "${{ env.ATTIC_TOKEN }}"
          nix run nixpkgs#attic-client -- use main

      # The .xip archives are deliberately outside the system closure, so the
      # build below would not notice one missing from attic; hosts would then
      # fail at activation instead.
      - name: Check Xcode archives are in attic
        if: ${{ matrix.system_attr == 'darwinConfigurations' }}
        run: |
          for path in $(nix eval --json ".#darwinConfigurations.${{ matrix.host }}.config.custom.xcode.xipPaths" | jq -r '.[]'); do
            hash=$(basename "$path" | cut -d- -f1)
            curl -fsS -o /dev/null -H "Authorization: Bearer $ATTIC_TOKEN" \
              "${ATTIC_CACHE_URL%/}/main/$hash.narinfo" \
              || { echo "::error::$path is not in attic, run xcode-fetch"; exit 1; }
          done

      - name: Build latest configuration
        run: |
          nix build "github:matteo-pacini/nixos-configs#${{ matrix.system_attr }}.${{ matrix.host }}.${{ matrix.build_attr }}" --out-link ./old-result --fallback

      - name: Build new configuration
        run: |
          nix build ".#${{ matrix.system_attr }}.${{ matrix.host }}.${{ matrix.build_attr }}" --out-link ./result --fallback

      - name: Compare configurations
        run: |

          echo "## Diff" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # diff-closures always emits ANSI color codes, even when piped
          nix store diff-closures ./old-result ./result \
            | sed -e 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Cache the PR's candidate toplevel so the post-merge master build in
      # build.yml is a cache hit. Chunks dedup globally with what build.yml
      # already pushed, so this costs only the PR's delta; merged paths get
      # re-pinned by build.yml, abandoned-PR paths age out under GC retention.
      - uses: nick-fields/retry@v4
        name: Push new configuration
        with:
          timeout_minutes: 60
          max_attempts: 5
          retry_on: error
          command: nix run nixpkgs#attic-client -- push main result -j 3
