# Auto-fix failed PR CI runs with Claude Code.
#
# Setup required (once):
#   1. Create a GitHub App (Settings -> Developer settings -> GitHub Apps):
#      permissions: Contents RW, Pull requests RW, Actions Read. Install on this repo.
#      Why an app: pushes made with the default GITHUB_TOKEN do not retrigger
#      workflows, so the fix commit would never re-run CI.
#   2. Repo secrets: AUTOFIX_APP_ID, AUTOFIX_APP_PRIVATE_KEY, CLAUDE_CODE_AUTH_TOKEN
#      (generate token with `claude setup-token` — subscription auth, no API key).
#
# Guardrails:
#   - Same-repo PRs only (forks never reach base secrets here).
#   - Max 3 autofix commits per PR, tracked via "[claude-autofix]" commit marker.
#   - Eval failures auto-fixed; build-only failures need the "autofix-build" label
#     (usually upstream breakage Claude cannot fix; macOS minutes are expensive).
#   - "no-autofix" label disables entirely.
#   - No attic/agenix secrets in this job; Claude's tools are allowlisted.

name: Claude Autofix

on:
  workflow_run:
    workflows: ["Build & Diff PR System"]
    types: [completed]

concurrency:
  group: claude-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for $BRANCH; skipping."
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -qx 'no-autofix'; then
            echo "no-autofix label present; skipping."
            exit 0
          fi

          ATTEMPTS=$(git log origin/master..HEAD --grep='\[claude-autofix\]' --oneline | wc -l)
          if [ "$ATTEMPTS" -ge 3 ]; then
            gh pr comment "$PR_NUMBER" --body "Autofix cap hit (3 attempts). Human needed."
            exit 0
          fi
          echo "attempt=$((ATTEMPTS + 1))" >> "$GITHUB_OUTPUT"

          FAILED_JOBS=$(gh run view "$RUN_ID" --json jobs \
            -q '.jobs[] | select(.conclusion=="failure") | .name')
          echo "Failed jobs:"
          echo "$FAILED_JOBS"
          if ! echo "$FAILED_JOBS" | grep -q '^eval' \
             && ! echo "$LABELS" | grep -qx 'autofix-build'; then
            gh pr comment "$PR_NUMBER" --body \
              "Build failure, not eval. No autofix — often upstream breakage. Add \`autofix-build\` label to opt in."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Capture failure logs
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed | tail -c 50000 > /tmp/ci-failure.log
          wc -c /tmp/ci-failure.log

      - name: Install Nix
        if: steps.gate.outputs.proceed == 'true'
        uses: nixbuild/nix-quick-install-action@v35

      - name: Claude autofix
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_AUTH_TOKEN }}
          claude_args: >-
            --model opus
            --max-turns 25
            --allowedTools "Read,Edit,Write,Grep,Glob,WebSearch,WebFetch,Bash(git:*),Bash(nix eval:*),Bash(nix fmt:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh search:*)"
          prompt: |
            Respond terse like smart caveman. All technical substance stay. Only
            fluff die. Level: full. Active every response, no drift.

            Rules: drop articles (a/an/the), filler (just/really/basically/
            actually/simply), pleasantries, hedging. Fragments OK. Short synonyms
            (big not extensive, fix not "implement a solution for"). No tool-call
            narration, no decorative tables/emoji, no dumping long raw error logs
            — quote shortest decisive line. Standard tech acronyms OK (DB/API/
            HTTP); never invent abbreviations (cfg/impl/req/res). No causal
            arrows. Technical terms exact. Code blocks unchanged. Errors quoted
            exact. No self-reference, never name the style.

            Pattern: [thing] [action] [reason]. [next step].

            Drop caveman when compression creates technical ambiguity or fragment
            order risks misread; resume after. Code: write normal. Commit
            messages: normal repo style.

            ---

            Task: CI failed on PR #${{ steps.gate.outputs.pr }} of this
            NixOS/nix-darwin flake repo. You are checked out on the PR branch.
            This is autofix attempt ${{ steps.gate.outputs.attempt }} of 3.

            1. Read /tmp/ci-failure.log — failing jobs' logs, truncated to last
               50KB. Diagnose root cause.
            2. Fix with minimal diff. Touch only what the error requires. No
               refactors, no drive-by cleanup.
            3. git add any new .nix files BEFORE running nix eval — the flake
               reads from the git store; untracked files are invisible.
            4. Verify all five configs eval green (all work on Linux):
                 nix eval ".#nixosConfigurations.<H>.config.system.build.toplevel.drvPath" --raw
                   for BrightFalls, Nexus, CauldronLake
                 nix eval ".#darwinConfigurations.<H>.config.system.build.toplevel.drvPath" --raw
                   for WorkLaptop, NightSprings
               If the failure was a build (not eval) failure you cannot reproduce
               it here — reason from the log, then confirm evals still green.
               For package build failures: search nixpkgs issues and open PRs
               (WebSearch, gh search) for an existing patch; pull it via
               fetchpatch in an overlay — overlays/shared.nix if it affects
               more than one host, otherwise overlays/<host>.nix.
            5. Run nix fmt on files you changed.
            6. Append to the PR body — fetch current body with
               gh pr view ${{ steps.gate.outputs.pr }} --json body -q .body,
               concatenate, then gh pr edit --body. NEVER replace existing body.
               New section: "## Autofix attempt ${{ steps.gate.outputs.attempt }}"
               with terse summary: what broke, what fixed, what verified.
            7. Commit in repo style (fix(host):, chore:, ...). Commit message MUST
               contain the marker "[claude-autofix]". Push to the current branch.
               Push is the LAST action — after the PR body edit.
            8. If you cannot fix with confidence: do NOT push guesses. Comment
               findings on the PR with gh pr comment, then stop.
