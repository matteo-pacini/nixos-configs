# Auto-fix failed PR CI runs with Claude Code.
#
# Setup required (once):
#   1. Create a GitHub App (Settings -> Developer settings -> GitHub Apps):
#      permissions: Contents RW, Pull requests RW, Actions Read. Install on this repo.
#      Why an app: pushes made with the default GITHUB_TOKEN do not retrigger
#      workflows, so the fix commit would never re-run CI.
#   2. Repo secrets: AUTOFIX_APP_ID, AUTOFIX_APP_PRIVATE_KEY, CLAUDE_CODE_AUTH_TOKEN
#      (generate token with `claude setup-token` — subscription auth, no API key).
#
# Guardrails:
#   - Same-repo PRs only (forks never reach base secrets here).
#   - Max 3 autofix commits per PR, tracked via "[claude-autofix]" commit marker.
#   - "no-autofix" label disables entirely.
#   - Attic cache configured (read/substitute) like other CI jobs; no agenix
#     identities here. Claude's tools are allowlisted.
#
# The fix job runs on a runner matching the failed host's platform (macOS for
# WorkLaptop/NightSprings, Linux otherwise) so Claude can reproduce build
# failures with a real `nix build`, not just reason from logs.

name: Claude Autofix
run-name: "Autofix: PR #${{ github.event.workflow_run.pull_requests[0].number || '?' }} (${{ github.event.workflow_run.head_branch }})"

on:
  workflow_run:
    workflows: ["Build & Diff PR System"]
    types: [completed]

concurrency:
  group: claude-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  route:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      pr: ${{ steps.gate.outputs.pr }}
      attempt: ${{ steps.gate.outputs.attempt }}
      runner: ${{ steps.gate.outputs.runner }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Gate and pick runner
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for $BRANCH; skipping."
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx 'no-autofix'; then
            echo "no-autofix label present; skipping."
            exit 0
          fi

          ATTEMPTS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json commits \
            -q '[.commits[].messageHeadline | select(contains("[claude-autofix]"))] | length')
          if [ "$ATTEMPTS" -ge 3 ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Autofix cap hit (3 attempts). Human needed."
            exit 0
          fi
          echo "attempt=$((ATTEMPTS + 1))" >> "$GITHUB_OUTPUT"

          FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            -q '.jobs[] | select(.conclusion=="failure") | .name')
          echo "Failed jobs:"
          echo "$FAILED_JOBS"
          # Evals run fine on Linux for every host; only darwin BUILD failures
          # need a macOS runner.
          if echo "$FAILED_JOBS" | grep -qE '^pr-build.*(WorkLaptop|NightSprings)'; then
            echo "runner=macos-latest" >> "$GITHUB_OUTPUT"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  autofix:
    needs: route
    if: needs.route.outputs.proceed == 'true'
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Capture failure logs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed | tail -c 50000 > /tmp/ci-failure.log
          wc -c /tmp/ci-failure.log

      - uses: wimpysworld/nothing-but-nix@v10
        if: ${{ needs.route.outputs.runner == 'ubuntu-latest' }}
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          nix-permission-edict: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-outputs = true
            ${{ needs.route.outputs.runner == 'ubuntu-latest' && 'build-dir = /nix/build' || '' }}

      - name: Configure Attic cache
        run: |
          nix run nixpkgs#attic-client -- login \
            nexus "${{ secrets.ATTIC_CACHE_URL }}" "${{ secrets.ATTIC_TOKEN }}"
          nix run nixpkgs#attic-client -- use main

      - name: Claude autofix
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_AUTH_TOKEN }}
          allowed_bots: "nixos-configs-autofix,github-actions"
          claude_args: >-
            --model opus
            --max-turns 50
            --allowedTools "Read,Edit,Write,Grep,Glob,WebSearch,WebFetch,Bash(git:*),Bash(nix eval:*),Bash(nix build:*),Bash(nix log:*),Bash(nix fmt:*),Bash(nix flake update:*),Bash(nix flake lock:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh search:*)"
          prompt: |
            Respond terse like smart caveman. All technical substance stay. Only
            fluff die. Level: full. Active every response, no drift.

            Rules: drop articles (a/an/the), filler (just/really/basically/
            actually/simply), pleasantries, hedging. Fragments OK. Short synonyms
            (big not extensive, fix not "implement a solution for"). No tool-call
            narration, no decorative tables/emoji, no dumping long raw error logs
            — quote shortest decisive line. Standard tech acronyms OK (DB/API/
            HTTP); never invent abbreviations (cfg/impl/req/res). No causal
            arrows. Technical terms exact. Code blocks unchanged. Errors quoted
            exact. No self-reference, never name the style.

            Pattern: [thing] [action] [reason]. [next step].

            Drop caveman when compression creates technical ambiguity or fragment
            order risks misread; resume after. Code: write normal. Commit
            messages: normal repo style.

            ---

            Task: CI failed on PR #${{ needs.route.outputs.pr }} of this
            NixOS/nix-darwin flake repo. You are checked out on the PR branch.
            This is autofix attempt ${{ needs.route.outputs.attempt }} of 3.
            This runner's platform matches the failed host, so nix builds of the
            failing derivation run natively here.

            1. Read /tmp/ci-failure.log — failing jobs' logs, truncated to last
               50KB. Diagnose root cause.
            2. FIRST check the PR body for previous "## Autofix attempt"
               sections. If a previous attempt already addressed this same
               failure and it still fails, do NOT retry the same class of fix —
               comment on the PR requesting human intervention (gh pr comment),
               then stop.
            3. Fix with minimal diff. Touch only what the error requires. No
               refactors, no drive-by cleanup.
            4. git add any new .nix files BEFORE running nix eval — the flake
               reads from the git store; untracked files are invisible.
            5. For eval failures, verify all five configs eval green (all work
               on Linux):
                 nix eval ".#nixosConfigurations.<H>.config.system.build.toplevel.drvPath" --raw
                   for BrightFalls, Nexus, CauldronLake
                 nix eval ".#darwinConfigurations.<H>.config.system.build.toplevel.drvPath" --raw
                   for WorkLaptop, NightSprings
            6. For KERNEL failures (BORE scheduler patch rot, linuxPackages,
               cpupower, anything patching kernel source): NEVER build kernel
               derivations here — far too slow for this runner. Fix at source:
               bump the relevant flake input (e.g.
               `nix flake update bore-scheduler-src`) or adjust
               modules/nixos/kernel.nix. MANDATORY: after ANY `nix flake update`,
               verify the updated bore-scheduler-src actually ships a BORE patch
               series for the NEW kernel version — read the input's patch
               files/directories in the nix store and match the kernel version
               string exactly. If no matching patch series exists, do NOT push
               the bump: comment on the PR requesting human intervention and
               stop. If it matches, confirm all five evals green; CI's next run
               does the real build.
            7. For other package build failures: reproduce by building ONLY the
               failing derivation (from the log), e.g.
                 nix build .#<systemAttr>.<Host>.pkgs.<pkg> or the store .drv path
               — never the whole toplevel. Skip reproduction if the package is
               massive (browsers, LLVM, webkit class); reason from the log
               instead. Search nixpkgs issues and open PRs (WebSearch, gh
               search) for an existing patch; pull it via fetchpatch in an
               overlay — overlays/shared.nix if it affects more than one host,
               otherwise overlays/<host>.nix. Verify the fix by rebuilding the
               failing derivation (unless massive), then confirm all five evals
               still green.
            8. Run nix fmt on files you changed.
            9. Append to the PR body — fetch current body with
               gh pr view ${{ needs.route.outputs.pr }} --json body -q .body,
               concatenate, then gh pr edit --body. NEVER replace existing body.
               New section: "## Autofix attempt ${{ needs.route.outputs.attempt }}"
               with terse summary: what broke, what fixed, what verified — enough
               detail that a future attempt can recognise the same failure.
            10. Commit in repo style (fix(host):, chore:, ...). Commit message
                MUST contain the marker "[claude-autofix]". Push to the current
                branch. Push is the LAST action — after the PR body edit.
            11. If you cannot fix with confidence: do NOT push guesses. Comment
                findings on the PR with gh pr comment, then stop.
