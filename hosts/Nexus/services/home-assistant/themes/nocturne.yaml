# Nocturne: the Dracula-based theme for this Home Assistant.
#
# Design system (tokens, usage rules, card previews, captures of every view):
#   https://claude.ai/artifact/LE95HYdwkCBnrbFUE9pvKY
# Motion study; the uix-card block below is the "Lacquer" direction:
#   https://claude.ai/artifact/N6fbU7Mxn4jxovYGMmQ8YU
#
# Colours come from the design system's tokens (Night = dark mode, Dawn =
# light mode). Change a colour there first, then here, so the two stay in step.
#
# uix-fonts and uix-card are read by the UIX integration (custom component
# "uix"), which only runs once it has a config entry. That entry was added in
# the UI and lives in /var/lib/hass/.storage, not here; re-add it (Settings >
# Devices & services > Add integration > UIX) if .storage is ever rebuilt.
# Without UIX the theme still applies; cards just lose the motion and the
# faces fall back to the system stacks below.
Nocturne:
  # UIX looks up uix-card and the other per-element styles by this name; without
  # it only uix-fonts applies.
  uix-theme: Nocturne
  uix-fonts: |
    Figtree:
      source: url(/local/nocturne-fonts/figtree.woff2) format('woff2')
      descriptors:
        weight: 300 900
    Sora:
      source: url(/local/nocturne-fonts/sora.woff2) format('woff2')
      descriptors:
        weight: 100 800
    JetBrains Mono:
      source: url(/local/nocturne-fonts/jetbrains-mono.woff2) format('woff2')
      descriptors:
        weight: 100 800

  ha-font-family-body: '"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif'
  ha-font-family-heading: '"Sora", "Figtree", system-ui, sans-serif'
  ha-font-family-code: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
  mdc-typography-font-family: '"Figtree", system-ui, sans-serif'

  ha-card-border-radius: 20px
  ha-card-border-width: 0px

  # Lacquer: cards rise in when a view loads, lift 2px on hover and a band of
  # light sweeps across them once. Fill mode is "backwards", not "both": a
  # finished animation that kept its end state would override the hover lift.
  # The sheen is a background-image on ha-card rather than a pseudo-element,
  # so ha-card needs no overflow: hidden (that would clip dropdown menus).
  uix-card: |
    ha-card {
      background-image: linear-gradient(105deg, transparent 35%, rgba(248, 248, 242, 0.06) 50%, transparent 65%);
      background-size: 250% 100%;
      background-position: 150% 0;
      background-repeat: no-repeat;
      transition:
        transform 280ms cubic-bezier(.2, .8, .2, 1),
        box-shadow 280ms cubic-bezier(.2, .8, .2, 1),
        background-color 280ms cubic-bezier(.2, .8, .2, 1),
        background-position 750ms cubic-bezier(.2, .8, .2, 1);
      animation: nocturne-rise 520ms cubic-bezier(.2, .8, .2, 1) backwards;
    }
    @media (hover: hover) {
      ha-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--nocturne-shadow-lift);
        background-position: -50% 0;
      }
      /* Heading cards have no surface, so there is nothing to lift. */
      :host(hui-heading-card) ha-card:hover {
        transform: none;
        box-shadow: none;
      }
    }
    @keyframes nocturne-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card { animation: none; transition: none; }
      ha-card:hover { transform: none; }
    }

  modes:
    # Night
    dark:
      primary-background-color: "#121219"
      lovelace-background: "radial-gradient(900px 520px at 0% 0%, rgba(189, 147, 249, 0.22), transparent 70%) fixed, #121219"
      secondary-background-color: "#1b1c25"
      sidebar-background-color: "#1b1c25"
      app-header-background-color: "#1b1c25"
      card-background-color: "#242633"
      ha-card-background: "#242633"
      input-fill-color: "#2e3042"
      code-editor-background-color: "#2e3042"
      markdown-code-background-color: "#2e3042"
      divider-color: "#393c52"

      primary-text-color: "#f8f8f2"
      app-header-text-color: "#f8f8f2"
      sidebar-selected-text-color: "#f8f8f2"
      secondary-text-color: "#b6b9d3"
      sidebar-text-color: "#b6b9d3"
      disabled-text-color: "#6272a4"
      disabled-color: "#6272a4"
      sidebar-icon-color: "#6272a4"
      state-icon-color: "#6272a4"
      text-primary-color: "#1b1c25"

      primary-color: "#bd93f9"
      accent-color: "#ff79c6"
      sidebar-selected-icon-color: "#bd93f9"
