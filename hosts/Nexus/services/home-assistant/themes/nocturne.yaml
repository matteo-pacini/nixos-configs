      switch-checked-button-color: "#bd93f9"
      switch-checked-track-color: "#bd93f9"
      switch-unchecked-button-color: "#b6b9d3"
      switch-unchecked-track-color: "#44475a"
      # ha-switch (2026.x) ignores the switch-* names above and reads these.
      ha-switch-checked-background-color: "#bd93f9"
      ha-switch-checked-background-color-hover: "#c9a6fb"
      ha-switch-checked-border-color: "#bd93f9"
      ha-switch-checked-border-color-hover: "#c9a6fb"
      ha-switch-checked-thumb-background-color: "#1b1c25"
      ha-switch-checked-thumb-background-color-hover: "#1b1c25"
