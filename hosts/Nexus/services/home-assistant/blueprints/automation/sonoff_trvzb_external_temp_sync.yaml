blueprint:
  name: Sonoff TRVZB External Temperature Sensor Sync
  description: >
    Forwards a temperature sensor's value to a Sonoff TRZVB via Zigbee2MQTT.
    On each sensor change, and every 30 minutes, publishes:
      {"external_temperature_input": <number>}
    to zigbee2mqtt/<TRV friendly name>/set (derived from the selected device).
    The TRV falls back to its own sensor 2 hours after the last value, so a
    steady room temperature needs the periodic resend. The resend stops once
    the sensor has not reported for 2 hours, which lets that fallback happen
    when the sensor is dead.
  domain: automation
  input:
    temp_sensor:
      name: Temperature sensor
      description: The room temperature sensor to forward to the TRV.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    trv_device:
      name: TRV device (from Zigbee2MQTT)
      description: Pick the TRV device; its device name (Z2M friendly name) builds the topic.
      selector:
        device:
          integration: mqtt

    base_topic:
      name: Zigbee2MQTT base topic
      description: Root topic used by Zigbee2MQTT.
      default: zigbee2mqtt
      selector:
        text:

    qos:
      name: MQTT QoS
      default: 1
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: slider

    retain:
      name: Retain message
      default: false
      selector:
        boolean:

mode: single

# Make inputs available to templates
variables:
  _temp_sensor: !input temp_sensor
  _trv_device: !input trv_device
  _base_topic: !input base_topic

  # Use the device's original name (Zigbee2MQTT friendly name)
  _friendly_name: >-
    {{ device_attr(_trv_device, 'name') | default('', true) }}

  # Final MQTT topic: base/friendly_name/set
  _mqtt_topic: >-
    {{ _base_topic ~ '/' ~ _friendly_name ~ '/set' }}

  # The TRV's own "temperature sensor select" entity
  _select_entity: >-
    {{ device_entities(_trv_device)
       | select('match', '^select\..*_temperature_sensor_select$')
       | first | default('', true) }}

trigger:
  - platform: state
    entity_id: !input temp_sensor
    to:
    not_from:
      - "unknown"
      - "unavailable"
  # Well inside the TRV's 2 hour fallback, so a few lost resends are harmless.
  - platform: time_pattern
    minutes: "/30"

# Only publish a number from a live sensor, to a non-empty friendly name
condition:
  - condition: template
    value_template: >-
      {{ states(_temp_sensor) | float(default=None) is not none }}
  # last_reported moves on every sensor report, including unchanged values.
  - condition: template
    value_template: >-
      {{ now() - states[_temp_sensor].last_reported < timedelta(hours=2) }}
  - condition: template
    value_template: >-
      {{ _friendly_name | length > 0 }}

action:
  # Select the remote source only when the TRV is on its own sensor. From
  # remote_source_offline it returns to remote_temperature by itself on the
  # next value, and each write here costs the TRV battery.
  - if:
      - condition: template
        value_template: >-
          {{ states(_select_entity) not in
             ['remote_temperature', 'remote_source_offline'] }}
    then:
      - service: mqtt.publish
        data:
          topic: "{{ _mqtt_topic }}"
          qos: !input qos
          retain: !input retain
          payload: >-
            {{ {'temperature_sensor_select': 'remote_temperature'} | tojson }}

  # Publish the external temperature value
  - service: mqtt.publish
    data:
      topic: "{{ _mqtt_topic }}"
      qos: !input qos
      retain: !input retain
      payload: >-
        {{ {'external_temperature_input':
              (states(_temp_sensor) | float(0))}
           | tojson }}
