# ACP profile set for the Modi 2: analog stereo out only, so desktop pickers
# don't list its S/PDIF profile. No paths-output, so the sink has no port and
# GNOME labels it by node.description alone.

[General]
auto-profiles = yes

[Mapping analog-stereo]
description = Stereo
device-strings = front:%f
channel-map = left,right
direction = output
